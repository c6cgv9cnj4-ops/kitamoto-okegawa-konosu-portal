name: Update local portal

on:
  schedule:
    - cron: "3,18,33,48 * * * *"   # 15分おき（電車遅延・地震情報は鮮度が重要なため短縮）
  workflow_dispatch: {}    # 手動実行ボタン用

permissions:
  contents: write

# 15分cronなので、前回が長引いたら今回はスキップして重複pushを防ぐ（2026-09-09 監査で追加）
concurrency:
  group: update-local-portal
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12   # fetch.py が対象サイトのハングで無制限に走るのを防ぐ（2026-09-09 監査で追加）
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch latest data and rebuild page
        run: python fetch.py

      - name: Commit and push if changed
        run: |
          git config user.name "local-portal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/index.html docs/rdb_history.json
          git diff --cached --quiet && echo "No changes" || (git commit -m "auto: update local portal $(date -u +'%Y-%m-%d %H:%M UTC')" && git push)
